const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(BOX.salt), iterations:BOX.iter, hash:"SHA-256"},
                                            base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(BOX.iv)}, key, b64(BOX.data));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
function saved(){ try { return localStorage.getItem("tb_pw"); } catch(e){ return null; } }
function save(pw){ try { localStorage.setItem("tb_pw", pw); } catch(e){} }
function forget(){ try { localStorage.removeItem("tb_pw"); } catch(e){} }
document.getElementById("f").onsubmit = async ev => {
  ev.preventDefault();
  const pw = document.getElementById("pw").value;
  document.getElementById("err").textContent = "Unlocking…";
  try {
    const html = await unlock(pw);
    if (document.getElementById("rem").checked) save(pw);
    show(html);
  } catch(e){ document.getElementById("err").textContent = "Wrong password."; }
};
(async () => { const pw = saved(); if (!pw) return;
  try { show(await unlock(pw)); } catch(e){ forget(); } })();
</script></body></html>
